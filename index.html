<!DOCTYPE html>

<style>
:root{color-scheme:dark;--ink:#f7f2ea;--muted:#cdbfac;--gold:#d2af76;--line:#ffffff14}
*{box-sizing:border-box}
html{background:#050608}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:#050608;min-height:100svh}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.shell{width:min(100%,490px);margin:0 auto;position:relative;min-height:100svh;background:linear-gradient(180deg,#07080a 0%,#050608 65%,#040507 100%);overflow:hidden}
.shell:after{content:"";pointer-events:none;position:absolute;inset:0;border-left:1px solid #ffffff0f;border-right:1px solid #ffffff0f}
.hero{height:clamp(560px,78svh,760px);position:relative;overflow:hidden;background:#07080a}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(.96) contrast(1.04)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top center,rgba(255,255,255,.03),transparent 40%),linear-gradient(180deg,rgba(0,0,0,.02) 0%,rgba(0,0,0,.05) 35%,rgba(5,6,8,.30) 56%,rgba(5,6,8,.78) 78%,#050608 100%)}
.eyebrow{position:absolute;top:max(28px,env(safe-area-inset-top));left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;z-index:2;font-size:10px;letter-spacing:.27em;color:#fff;text-shadow:0 1px 10px #000a}
.dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-right:8px;box-shadow:0 0 10px rgba(210,175,118,.55)}
.hero-mark{position:absolute;bottom:292px;left:34px;right:34px;z-index:2;text-align:left}
.hero-mark .rule{width:54px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:0 0 10px;opacity:.95}
.hero-mark small{font-size:11px;letter-spacing:.34em;color:#efe4d4}
.content{position:relative;margin-top:-270px;padding:0 22px max(40px,env(safe-area-inset-bottom));z-index:3}
.head-copy{max-width:66%;padding-left:12px}
.name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,11vw,60px);letter-spacing:-.05em;font-weight:400;margin:0 0 8px;color:#fdf8f1;text-shadow:0 2px 20px rgba(0,0,0,.46);text-align:left}
.sub{font-size:12px;letter-spacing:.36em;color:var(--gold);margin:0 0 14px;text-shadow:0 2px 10px rgba(0,0,0,.34);text-align:left}
.description{font-size:13px;color:#f1e8dc;letter-spacing:.05em;line-height:1.95;margin:0 0 24px;text-shadow:0 2px 14px rgba(0,0,0,.42);text-align:left}
.divider{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:12px;margin:0 0 16px;padding:0 6px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(210,175,118,.34),transparent)}
.links{display:grid;gap:12px}
.social{display:flex;align-items:center;width:100%;border:1px solid rgba(210,175,118,.24);border-radius:18px;padding:17px 15px 17px 18px;background:linear-gradient(135deg,rgba(9,11,14,.92),rgba(6,7,10,.88));backdrop-filter:blur(8px);text-align:left;min-height:82px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 12px 28px rgba(0,0,0,.28);transition:transform .15s,background .15s,border-color .15s}
.social:active{transform:scale(.985);background:linear-gradient(135deg,rgba(16,18,22,.97),rgba(8,10,13,.93));border-color:rgba(210,175,118,.42)}
.logo{flex:0 0 46px;height:46px;display:grid;place-items:center;border-radius:14px;font-size:22px;font-weight:800;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.line{background:#06c755;font-size:11px;border-radius:13px}.youtube{background:#f00}
.social-copy{padding:0 14px;flex:1;min-width:0}
.social-title{font-size:15px;font-weight:650;letter-spacing:.05em;color:#fcf7ef;display:block;line-height:1.3}.social-note{font-size:11px;letter-spacing:.05em;color:#baa88f;margin-top:6px;display:block;line-height:1.35}
.chev{color:var(--gold);font-size:26px;font-weight:200;padding-right:4px}
.tools{display:flex;gap:10px;margin-top:16px}.tool{flex:1;border:1px solid #ffffff12;border-radius:13px;background:rgba(255,255,255,.02);color:#ece2d2;padding:13px 6px;font-size:12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}.tool:active{background:rgba(255,255,255,.06)}
.footer{padding-top:22px;color:#7f715f;font-size:11px;letter-spacing:.17em;text-align:center}.footer em{font-family:Georgia,serif;font-size:17px;font-weight:400;color:var(--gold);letter-spacing:.04em}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.dialog{width:min(100%,410px);background:#fff;color:#222;border-radius:18px;padding:20px;text-align:center}.dialog img{display:block;width:100%;max-height:60svh;object-fit:contain;border-radius:6px}.dialog button{border:0;background:#222;color:white;padding:12px 24px;border-radius:10px;margin-top:12px}
.qr-dialog{background:#f9f7f3;padding:24px 20px 20px;border-radius:22px;box-shadow:0 18px 70px #0008}.qr-dialog h2{font-size:20px;margin:0 0 5px}.qr-help{font-size:12px;color:#777;margin:0 0 17px}.qr-tabs{display:flex;gap:8px;margin:0 0 15px}.qr-tab{flex:1;background:#eeeae2;color:#292827;border:1px solid #ddd7cb;border-radius:10px;padding:12px 4px;font-size:13px}.qr-tab.active{color:#fff;background:#151515;border-color:#151515}.qr-dialog #qr-image{width:min(100%,285px);margin:0 auto;image-rendering:auto;max-height:none;border:10px solid white;background:white;border-radius:8px;aspect-ratio:1;object-fit:contain}.qr-caption{font-size:13px;font-weight:600;margin:6px 0 12px}.qr-actions{display:flex;gap:10px}.qr-actions>*{flex:1;margin:0!important;display:grid;place-items:center;text-decoration:none;background:#202020;color:#fff;border-radius:10px;padding:12px;font-size:14px}.qr-actions #close{background:#e6e1d8;color:#262626}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f0e2ca;color:#212121;padding:12px 20px;border-radius:100px;font-size:12px;display:none;white-space:nowrap;z-index:90}.toast.show{display:block}
@media(min-width:650px){body{padding:32px 0}.shell{border-radius:24px;min-height:900px;box-shadow:0 18px 80px #0008}.hero{height:720px}.hero-mark{bottom:310px}.content{margin-top:-285px}}
</style>
</head>
<body>
<main class="shell">
 <section class="hero" aria-label="個人形象照片"><img src="portrait.jpg" alt="個人照片"><div class="eyebrow"><span><span class="dot"></span>DIGITAL CONTACT CARD</span><span>01 / 01</span></div><div class="hero-mark"><div class="rule"></div><small>NICE TO MEET YOU</small></div></section>
 <section class="content"><div class="head-copy"><h1 class="name">Ming</h1><div class="sub">很 高 興 認 識 你</div><p class="description">認識新朋友・分享我的創作<br>很高興在這裡與你相遇。</p></div><div class="divider">✦ CONNECT WITH ME ✦</div>
  <div class="links"><a class="social" href="https://line.me/ti/p/vgc4C_FVZv" target="_blank" rel="noopener noreferrer" aria-label="開啟 LINE 加好友"><span class="logo line">LINE</span><span class="social-copy"><span class="social-title">LINE 加好友</span><span class="social-note">點一下，直接打開 LINE</span></span><span class="chev">›</span></a>
  <a class="social" href="https://www.youtube.com/@bonskaz" target="_blank" rel="noopener noreferrer" aria-label="開啟 YouTube 頻道"><span class="logo youtube">▶</span><span class="social-copy"><span class="social-title">YouTube 頻道</span><span class="social-note">我自己動手製作的 YouTube 頻道</span></span><span class="chev">›</span></a></div>
  <div class="tools"><button class="tool" type="button" id="share">↗　分享名片</button><button class="tool" type="button" id="copy">▣　複製網址</button><button class="tool" type="button" id="qr">▦　顯示 QR</button></div>
  <div class="tools" style="margin-top:10px"><a class="tool" href="ming.vcf" style="text-align:center">＋　儲存 Ming 聯絡人</a></div><div class="footer"><em>Make a connection.</em><br><br>PERSONAL SOCIAL CARD</div>
 </section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="選擇社群 QR Code">
 <div class="dialog qr-dialog"><h2>我的社群 QR Code</h2><p class="qr-help">選擇要分享的社群，讓朋友直接掃描</p>
 <div class="qr-tabs" role="group" aria-label="選擇 QR Code"><button type="button" class="qr-tab active" data-qr="line" aria-pressed="true">LINE 加好友</button><button type="button" class="qr-tab" data-qr="youtube" aria-pressed="false">YouTube 頻道</button></div>
 <img id="qr-image" src="line-qr.png" alt="LINE 加好友 QR Code"><p id="qr-name" class="qr-caption">LINE 加好友</p>
 <div class="qr-actions"><a id="qr-go" href="https://line.me/ti/p/vgc4C_FVZv" target="_blank" rel="noopener noreferrer">直接開啟</a><button id="close" type="button">關閉</button></div>
 </div></div><div class="toast" id="toast" role="status"></div>
<script>
const toast=document.getElementById('toast');function notice(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}
const link=()=>location.protocol==='file:'?'':location.href;
document.getElementById('share').addEventListener('click',async()=>{if(location.protocol==='file:'){notice('請部署到 GitHub Pages 後分享');return}if(navigator.share){try{await navigator.share({title:'Ming 的個人交友名片',text:'很高興認識你！',url:link()})}catch(e){if(e.name!=='AbortError')notice('無法分享，請改用複製網址')}}else{try{await navigator.clipboard.writeText(link());notice('已複製名片網址')}catch(e){notice('請使用瀏覽器分享功能')}}});
document.getElementById('copy').addEventListener('click',async()=>{if(!link()){notice('部署後才會有公開網址');return}try{await navigator.clipboard.writeText(link());notice('名片網址已複製')}catch(e){notice('請從網址列複製網址')}});
const modal=document.getElementById('modal');
const qrImage=document.getElementById('qr-image'),qrName=document.getElementById('qr-name'),qrGo=document.getElementById('qr-go');
const qrData={line:{src:'line-qr.png',name:'LINE 加好友',url:'https://line.me/ti/p/vgc4C_FVZv'},youtube:{src:'youtube-qr.png',name:'YouTube 頻道',url:'https://www.youtube.com/@bonskaz'}};
document.querySelectorAll('.qr-tab').forEach(btn=>btn.addEventListener('click',()=>{const key=btn.dataset.qr,item=qrData[key];qrImage.src=item.src;qrImage.alt=item.name+' QR Code';qrName.textContent=item.name;qrGo.href=item.url;document.querySelectorAll('.qr-tab').forEach(tab=>{const current=tab===btn;tab.classList.toggle('active',current);tab.setAttribute('aria-pressed',String(current))});}));
document.getElementById('qr').onclick=()=>modal.classList.add('open');document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script>
</body></html>
