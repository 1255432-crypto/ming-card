<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#171a1d">
<meta name="description" content="個人交友名片｜分享 LINE 與我自己製作的 YouTube 頻道。"><title>Ming｜個人交友名片</title>
<meta property="og:title" content="Ming｜個人交友名片"><meta property="og:description" content="認識新朋友 · 分享我的創作"><meta property="og:type" content="website"><meta property="og:image" content="portrait.jpg">
<style>
:root{color-scheme:dark;--ink:#f5efe4;--muted:#b8ab97;--gold:#c9a56b;--gold-soft:#8f7346;--line:#ffffff14}
*{box-sizing:border-box}
html{background:#050608}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:#050608;min-height:100svh}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.shell{width:min(100%,490px);margin:0 auto;position:relative;min-height:100svh;background:linear-gradient(180deg,#090a0c 0%,#060709 58%,#050608 100%);overflow:hidden}
.shell:after{content:"";pointer-events:none;position:absolute;inset:0;border-left:1px solid #ffffff10;border-right:1px solid #ffffff10}
.hero{height:clamp(520px,76svh,740px);position:relative;overflow:hidden;background:#07080a}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 22%;filter:saturate(.95) contrast(1.04)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at top center,rgba(255,255,255,.03),transparent 36%),linear-gradient(180deg,rgba(0,0,0,.02) 0%,rgba(0,0,0,.08) 40%,rgba(5,6,8,.55) 72%,#050608 100%)}
.eyebrow{position:absolute;top:max(28px,env(safe-area-inset-top));left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;z-index:2;font-size:10px;letter-spacing:.27em;color:#fff;text-shadow:0 1px 10px #000a}
.dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-right:8px;box-shadow:0 0 10px rgba(201,165,107,.55)}
.hero-mark{position:absolute;bottom:248px;left:0;right:0;z-index:2;text-align:center}
.hero-mark .rule{width:54px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 10px;opacity:.95}
.hero-mark small{font-size:11px;letter-spacing:.34em;color:#efe4d4}
.content{position:relative;margin-top:-230px;padding:0 24px max(42px,env(safe-area-inset-bottom));text-align:center;z-index:3}
.name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(46px,11vw,58px);letter-spacing:-.05em;font-weight:400;margin:0 0 8px;color:#fbf6ee;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.sub{font-size:12px;letter-spacing:.36em;color:var(--gold);margin:0 0 14px;text-shadow:0 2px 10px rgba(0,0,0,.28)}
.description{font-size:13px;color:#e1d8cb;letter-spacing:.05em;line-height:1.95;margin:0 auto 24px;text-shadow:0 2px 12px rgba(0,0,0,.32)}
.divider{display:flex;align-items:center;gap:14px;color:var(--gold);font-size:12px;margin:0 0 18px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(201,165,107,.36),transparent)}
.links{display:grid;gap:12px}
.social{display:flex;align-items:center;width:100%;border:1px solid rgba(201,165,107,.26);border-radius:18px;padding:17px 15px 17px 18px;background:linear-gradient(135deg,rgba(13,15,18,.88),rgba(8,9,12,.82));backdrop-filter:blur(6px);text-align:left;min-height:82px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 12px 30px rgba(0,0,0,.24);transition:transform .15s,background .15s,border-color .15s}
.social:active{transform:scale(.985);background:linear-gradient(135deg,rgba(20,22,26,.96),rgba(10,11,14,.9));border-color:rgba(201,165,107,.45)}
.logo{flex:0 0 46px;height:46px;display:grid;place-items:center;border-radius:14px;font-size:22px;font-weight:800;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.line{background:#06c755;font-size:11px;border-radius:13px}.youtube{background:#f00}
.social-copy{padding:0 14px;flex:1}
.social-title{font-size:15px;font-weight:650;letter-spacing:.05em;color:#fcf7ef}.social-note{font-size:11px;letter-spacing:.05em;color:#baa88f;margin-top:5px}
.chev{color:var(--gold);font-size:26px;font-weight:200;padding-right:4px}
.tools{display:flex;gap:10px;margin-top:18px}.tool{flex:1;border:1px solid #ffffff14;border-radius:13px;background:rgba(255,255,255,.02);color:#ece2d2;padding:13px 6px;font-size:12px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}.tool:active{background:rgba(255,255,255,.06)}
.footer{padding-top:24px;color:#7f715f;font-size:11px;letter-spacing:.17em}.footer em{font-family:Georgia,serif;font-size:17px;font-weight:400;color:var(--gold);letter-spacing:.04em}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.dialog{width:min(100%,410px);background:#fff;color:#222;border-radius:18px;padding:20px;text-align:center}.dialog img{display:block;width:100%;max-height:60svh;object-fit:contain;border-radius:6px}.dialog button{border:0;background:#222;color:white;padding:12px 24px;border-radius:10px;margin-top:12px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f0e2ca;color:#212121;padding:12px 20px;border-radius:100px;font-size:12px;display:none;white-space:nowrap;z-index:90}.toast.show{display:block}
@media(min-width:650px){body{padding:32px 0}.shell{border-radius:24px;min-height:900px;box-shadow:0 18px 80px #0008}.hero{height:700px}.hero-mark{bottom:270px}.content{margin-top:-245px}}
</style>
</head>
<body>
<main class="shell">
 <section class="hero" aria-label="個人形象照片"><img src="portrait.jpg" alt="個人照片"><div class="eyebrow"><span><span class="dot"></span>DIGITAL CONTACT CARD</span><span>01 / 01</span></div><div class="hero-mark"><div class="rule"></div><small>NICE TO MEET YOU</small></div></section>
 <section class="content"><h1 class="name">Ming</h1><div class="sub">很 高 興 認 識 你</div><p class="description">認識新朋友 · 分享我的創作<br>很高興在這裡與你相遇。</p><div class="divider">✦ CONNECT WITH ME ✦</div>
  <div class="links"><a class="social" href="https://line.me/ti/p/vgc4C_FVZv" target="_blank" rel="noopener noreferrer" aria-label="開啟 LINE 加好友"><span class="logo line">LINE</span><span class="social-copy"><span class="social-title">LINE 加好友</span><span class="social-note">點一下，直接打開 LINE</span></span><span class="chev">›</span></a>
  <a class="social" href="https://www.youtube.com/@bonskaz" target="_blank" rel="noopener noreferrer" aria-label="開啟 YouTube 頻道"><span class="logo youtube">▶</span><span class="social-copy"><span class="social-title">YouTube 頻道</span><span class="social-note">我自己動手製作的 YouTube 頻道</span></span><span class="chev">›</span></a></div>
  <div class="tools"><button class="tool" type="button" id="share">↗　分享名片</button><button class="tool" type="button" id="copy">▣　複製網址</button><button class="tool" type="button" id="qr">▦　顯示 QR</button></div>
  <div class="footer"><em>Make a connection.</em><br><br>PERSONAL SOCIAL CARD</div>
 </section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="LINE 加好友 QR Code"><div class="dialog"><strong>LINE 加好友 QR Code</strong><img src="line-qr.png" alt="LINE 加好友 QR Code"><button id="close" type="button">關閉</button></div></div><div class="toast" id="toast" role="status"></div>
<script>
const toast=document.getElementById('toast');function notice(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}
const link=()=>location.protocol==='file:'?'':location.href;
document.getElementById('share').addEventListener('click',async()=>{if(location.protocol==='file:'){notice('請部署到 GitHub Pages 後分享');return}if(navigator.share){try{await navigator.share({title:'Ming 的個人交友名片',text:'很高興認識你！',url:link()})}catch(e){if(e.name!=='AbortError')notice('無法分享，請改用複製網址')}}else{try{await navigator.clipboard.writeText(link());notice('已複製名片網址')}catch(e){notice('請使用瀏覽器分享功能')}}});
document.getElementById('copy').addEventListener('click',async()=>{if(!link()){notice('部署後才會有公開網址');return}try{await navigator.clipboard.writeText(link());notice('名片網址已複製')}catch(e){notice('請從網址列複製網址')}});
const modal=document.getElementById('modal');document.getElementById('qr').onclick=()=>modal.classList.add('open');document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script>
</body></html>
