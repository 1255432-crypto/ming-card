<style>
:root{color-scheme:dark;--ink:#f5eee3;--muted:#bcb1a1;--gold:#d1ab72;--line:#ffffff24}*{box-sizing:border-box}html{background:#111316}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:#111316;min-height:100svh}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}.shell{width:min(100%,490px);margin:0 auto;position:relative;min-height:100svh;background:radial-gradient(ellipse 75% 35% at 50% 45%,#3b3027 0%,transparent 80%),linear-gradient(180deg,#1b1c1c 0%,#18191b 75%,#131516 100%);overflow:hidden}.shell:after{content:"";pointer-events:none;position:absolute;inset:0;border-left:1px solid #ffffff16;border-right:1px solid #ffffff16}.hero{height:clamp(325px,57svh,510px);position:relative;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 24%;filter:saturate(.83) contrast(1.02)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,19,22,.04) 25%,rgba(17,19,22,.1) 54%,#1b1c1c 100%)}.eyebrow{position:absolute;top:max(28px,env(safe-area-inset-top));left:25px;right:25px;display:flex;align-items:center;justify-content:space-between;z-index:1;font-size:10px;letter-spacing:.27em;color:#fff;text-shadow:0 1px 6px #0008}.dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin-right:8px}.hero-mark{position:absolute;bottom:14px;left:0;right:0;z-index:1;text-align:center}.hero-mark .rule{width:45px;height:1px;background:var(--gold);margin:0 auto 10px;opacity:.85}.hero-mark small{font-size:11px;letter-spacing:.34em;color:#eadfcf}.content{position:relative;margin-top:-2px;padding:0 25px max(42px,env(safe-area-inset-bottom));text-align:center}.name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(39px,10vw,52px);letter-spacing:-.045em;font-weight:400;margin:9px 0 4px;color:#f4eadd}.sub{font-size:12px;letter-spacing:.3em;color:var(--gold);margin:8px 0 11px}.description{font-size:13px;color:#c9beb0;letter-spacing:.06em;line-height:1.9;margin:0 auto 27px}.divider{display:flex;align-items:center;gap:15px;color:var(--gold);font-size:12px;margin-bottom:20px}.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#a38c695e,transparent)}.links{display:grid;gap:12px}.social{display:flex;align-items:center;width:100%;border:1px solid #bd9e6e65;border-radius:15px;padding:17px 15px 17px 18px;background:linear-gradient(135deg,#33312e,#242527);text-align:left;min-height:79px;box-shadow:0 9px 30px #0002;transition:transform .15s,background .15s}.social:active{transform:scale(.98);background:#393632}.logo{flex:0 0 43px;height:43px;display:grid;place-items:center;border-radius:13px;font-size:22px;font-weight:800;color:#fff}.line{background:#06c755;font-size:11px;border-radius:12px}.youtube{background:#f00}.social-copy{padding:0 14px;flex:1}.social-title{font-size:15px;font-weight:600;letter-spacing:.05em}.social-note{font-size:11px;letter-spacing:.05em;color:#c5b9a9;margin-top:5px}.chev{color:var(--gold);font-size:26px;font-weight:200;padding-right:4px}.tools{display:flex;gap:10px;margin-top:23px}.tool{flex:1;border:1px solid #ffffff28;border-radius:12px;background:transparent;color:#ece2d2;padding:13px 6px;font-size:12px;cursor:pointer}.tool:active{background:#ffffff14}.footer{padding-top:26px;color:#8d8072;font-size:11px;letter-spacing:.17em}.footer em{font-family:Georgia,serif;font-size:17px;font-weight:400;color:var(--gold);letter-spacing:.04em}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:22px}.modal.open{display:flex}.dialog{width:min(100%,410px);background:#fff;color:#222;border-radius:18px;padding:20px;text-align:center}.dialog img{display:block;width:100%;max-height:60svh;object-fit:contain;border-radius:6px}.dialog button{border:0;background:#222;color:white;padding:12px 24px;border-radius:10px;margin-top:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#f0e2ca;color:#212121;padding:12px 20px;border-radius:100px;font-size:12px;display:none;white-space:nowrap;z-index:90}.toast.show{display:block}@media(min-width:650px){body{padding:32px 0}.shell{border-radius:24px;min-height:900px;box-shadow:0 18px 80px #0007}.hero{height:455px}}
</style>
</head>
<body>
<main class="shell">
 <section class="hero" aria-label="個人形象照片"><img src="portrait.jpg" alt="個人照片"><div class="eyebrow"><span><span class="dot"></span>DIGITAL CONTACT CARD</span><span>01 / 01</span></div><div class="hero-mark"><div class="rule"></div><small>NICE TO MEET YOU</small></div></section>
 <section class="content"><h1 class="name">Ming</h1><div class="sub">很 高 興 認 識 你</div><p class="description">認識新朋友 · 分享我的創作<br>很高興在這裡與你相遇。</p><div class="divider">✦ CONNECT WITH ME ✦</div>
  <div class="links"><a class="social" href="https://line.me/ti/p/vgc4C_FVZv" target="_blank" rel="noopener noreferrer" aria-label="開啟 LINE 加好友"><span class="logo line">LINE</span><span class="social-copy"><span class="social-title">LINE 加好友</span><span class="social-note">點一下，直接打開 LINE</span></span><span class="chev">›</span></a>
  <a class="social" href="https://www.youtube.com/@bonskaz" target="_blank" rel="noopener noreferrer" aria-label="開啟 YouTube 頻道"><span class="logo youtube">▶</span><span class="social-copy"><span class="social-title">YouTube 頻道</span><span class="social-note">我自己動手製作的 YouTube 頻道</span></span><span class="chev">›</span></a></div>
  <div class="tools"><button class="tool" type="button" id="share">↗　分享名片</button><button class="tool" type="button" id="copy">▣　複製網址</button><button class="tool" type="button" id="qr">▦　顯示 QR</button></div>
  <div class="footer"><em>Make a connection.</em><br><br>PERSONAL SOCIAL CARD</div>
 </section>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="LINE 加好友 QR Code"><div class="dialog"><strong>LINE 加好友 QR Code</strong><img src="line-qr.png" alt="LINE 加好友 QR Code"><button id="close" type="button">關閉</button></div></div><div class="toast" id="toast" role="status"></div>
<script>
const toast=document.getElementById('toast');function notice(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}
const link=()=>location.protocol==='file:'?'':location.href;
document.getElementById('share').addEventListener('click',async()=>{if(location.protocol==='file:'){notice('請部署到 GitHub Pages 後分享');return}if(navigator.share){try{await navigator.share({title:'Ming 的個人交友名片',text:'很高興認識你！',url:link()})}catch(e){if(e.name!=='AbortError')notice('無法分享，請改用複製網址')}}else{try{await navigator.clipboard.writeText(link());notice('已複製名片網址')}catch(e){notice('請使用瀏覽器分享功能')}}});
document.getElementById('copy').addEventListener('click',async()=>{if(!link()){notice('部署後才會有公開網址');return}try{await navigator.clipboard.writeText(link());notice('名片網址已複製')}catch(e){notice('請從網址列複製網址')}});
const modal=document.getElementById('modal');document.getElementById('qr').onclick=()=>modal.classList.add('open');document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});
</script>
</body></html>
